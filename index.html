<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スコアカウンター</title>
    <style>
        /* 簡単な見た目の調整（お好みで変更してください） */
        body {
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
            background-color: #f9f9f9;
        }
        .score-container {
            font-size: 2rem;
            margin-bottom: 20px;
        }
        button {
            font-size: 1.2rem;
            padding: 10px 20px;
            cursor: pointer;
            background-color: #00b300;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:active {
            background-color: #008000;
        }
    </style>
</head>
<body>

    <div class="score-container">
        スコア: <span id="score">0</span>
    </div>
    <button onclick="window.addScore()">スコアアップ！</button>

    <script type="module">
        // Firebaseの必要な機能をCDNから読み込み
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebaseの設定（★ご自身のプロジェクトの設定に書き換えてください★）
        const firebaseConfig = {
    apiKey: "AIzaSyCD26WdXWp8wAXwfXAMVNBCdB0ni-G2-Ak",
    authDomain: "test1-1ca88.firebaseapp.com",
    projectId: "test1-1ca88",
    storageBucket: "test1-1ca88.firebasestorage.app",
    messagingSenderId: "83179042763",
    appId: "1:83179042763:web:a4524acb39fb514362684e",
    measurementId: "G-22940J9VLK"
  };

        // Firebaseの初期化
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.score = 0;
        let saveTimeout = null;

        // UI（画面）の更新
        function updateUI(){
            const scoreDoc = document.getElementById("score");
            if (scoreDoc) {
                scoreDoc.innerText = window.score;
            }
        }

        // スコア増加（画面はすぐ更新、保存は裏で0.5秒遅延させる）
        window.addScore = function() {
            window.score += 1;
            updateUI();

            // 前回の保存タイマーが残っていればキャンセル
            clearTimeout(saveTimeout);

            // 500ミリ秒（0.5秒）間、次のクリックがなければ保存を実行
            saveTimeout = setTimeout(() => {
                window.saveScore(window.score);
            }, 500);
        };

        // Firestoreへの保存
        window.saveScore = async function(score){
            try {
                await setDoc(doc(db, "scores", "player1"), { score: score });
                console.log("スコアを保存しました:", score);
            } catch (error) {
                console.error("保存エラー:", error);
            }
        };

        // Firestoreからの読み込み
        window.loadScore = async function(){
            try {
                const docSnap = await getDoc(doc(db, "scores", "player1"));
                if (docSnap.exists()) {
                    window.score = docSnap.data().score;
                } else {
                    window.score = 0;
                }
                updateUI();
            } catch (error) {
                console.error("読み込みエラー:", error);
            }
        };

        // ページが読み込まれたら実行
        window.addEventListener("load", window.loadScore);
    </script>
</body>
</html>
