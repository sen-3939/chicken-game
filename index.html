<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スコアカウンター</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
            background-color: #f9f9f9;
        }
        .score-container {
            font-size: 2rem;
            margin-bottom: 20px;
        }
        button {
            font-size: 1.2rem;
            padding: 10px 20px;
            cursor: pointer;
            background-color: #00b300;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:active {
            background-color: #008000;
        }
    </style>
</head>
<body>

    <div class="score-container">
        スコア: <span id="score">0</span>
    </div>
    <button onclick="window.addScore()">スコアアップ！</button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
  apiKey: "AIzaSyCD26WdXWp8wAXwfXAMVNBCdB0ni-G2-Ak",
  authDomain: "test1-1ca88.firebaseapp.com",
  projectId: "test1-1ca88",
  storageBucket: "test1-1ca88.firebasestorage.app",
  messagingSenderId: "83179042763",
  appId: "1:83179042763:web:a4524acb39fb514362684e",
  measurementId: "G-22940J9VLK"
};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 【改善のキモ】ページを読み込んだ瞬間（Firebaseに繋ぐ前）に、パソコン内の記憶から即表示！
        const localCachedScore = localStorage.getItem("last_score");
        window.score = localCachedScore ? parseInt(localCachedScore, 10) : 0;
        
        // 画面がパッと開いた瞬間に、前回の数字を入れる（これで「一瞬0」も「空白」も起きない）
        document.getElementById("score").innerText = window.score;

        function updateUI(){
            const scoreDoc = document.getElementById("score");
            if (scoreDoc) {
                scoreDoc.innerText = window.score;
            }
        }

        window.addScore = function() {
            window.score += 1;
            updateUI();
            
            // パソコン内（ローカル）とFirebase（クラウド）の両方に即時保存！
            localStorage.setItem("last_score", window.score);
            window.saveScore(window.score);
        };

        window.saveScore = async function(score){
            try {
                await setDoc(doc(db, "scores", "player1"), { score: score });
                console.log("Firebaseに保存しました:", score);
            } catch (error) {
                console.error("保存エラー:", error);
            }
        };

        window.loadScore = async function(){
            try {
                const docSnap = await getDoc(doc(db, "scores", "player1"));
                if (docSnap.exists()) {
                    const cloudScore = docSnap.data().score;
                    
                    // 裏側でFirebaseの最新データに追いつかせる
                    window.score = cloudScore;
                    localStorage.setItem("last_score", cloudScore);
                    updateUI();
                }
            } catch (error) {
                console.error("読み込みエラー:", error);
            }
        };

        // ページが読み込まれたら裏でFirebaseの最新データをチェックしにいく
        window.addEventListener("load", window.loadScore);
    </script>
</body>
</html>
